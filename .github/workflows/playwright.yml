name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]


jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Checkout confac repo
        uses: actions/checkout@v4
        with:
          repository: itenium-be/confac
          path: confac

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install confac dependencies
        run: |
          cd confac/backend  
          npm ci
          cd ../frontend
          npm ci

      - name: Copy sample.env to .env
        run: |
          cd confac/backend
          cp .env.sample .env

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

              - name: Debug workspace layout
        run: |
          echo "🧭 Current working directory:"
          pwd
          echo
          
          echo "📁 List all files from root of workspace:"
          ls -R -la
          echo

          echo "📦 Check where confac repo landed:"
          ls -la confac || echo "confac directory not found"
          echo

          echo "📦 Check backend and frontend folders if they exist:"
          ls -la confac/backend || echo "backend directory not found"
          ls -la confac/frontend || echo "frontend directory not found"
          echo

          echo "🔍 Which npm binary is being used:"
          which npm || echo "npm not found in PATH"
          echo

          echo "🧩 Node version:"
          node -v


      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !always() }}
        with:
          name: playwright-report
          path: 
            playwright-report/
          retention-days: 7
      - name: Upload backend and frontend logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            backend.log
            frontend.log
