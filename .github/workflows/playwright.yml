name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]


jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Checkout confac repo
        uses: actions/checkout@v4
        with:
          repository: itenium-be/confac
          path: confac

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install confac dependencies
        run: |
          cd confac/backend  
          npm ci
          cd ../frontend
          npm ci

      - name: Copy sample.env to .env
        run: |
          cd confac/backend
          cp .env.sample .env

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: 
            playwright-report/
          retention-days: 7
      - name: Upload backend and frontend logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            backend.log
            frontend.log
